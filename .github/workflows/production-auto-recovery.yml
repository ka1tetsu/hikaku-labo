name: Vivlica production auto-recovery

# GitHub Actions and Vercel may be quota-limited through October 2026.
# No background runners or credentials required until scheduled Actions can run.
on:
  workflow_dispatch:
  schedule:
    # JST 09:17 on days 1,5,9,13,17,21,25,29. Off the busy hour.
    - cron: '17 0 1,5,9,13,17,21,25,29 * *'

permissions:
  contents: write
  actions: read

concurrency:
  group: vivlica-production-auto-recovery
  cancel-in-progress: false

jobs:
  recover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 5
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Check time and exact released commit
        id: inspect
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(date -u +%Y%m%d)" < "20261101" ]]; then
            echo "October quota recovery is not assumed; no deployment before November."
            echo "retry=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch origin main --depth=1
          if [ "$(git rev-parse origin/main)" != "$(git rev-parse HEAD)" ]; then
            echo "::warning::main moved during checkout; defer the retry."
            echo "retry=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=0
          node scripts/release-recovery.mjs check "$(git rev-parse HEAD)" || code=$?
          if [ "$code" -eq 0 ]; then
            echo "Production already serves exactly this commit; no build needed."
            echo "retry=false" >> "$GITHUB_OUTPUT"
          elif [ "$code" -eq 2 ]; then
            echo "Current production metadata is valid, but the commit is stale."
            # Refuse to deploy a broken/untested main commit merely because it is newer.
            GITHUB_TOKEN="${{ github.token }}" node scripts/recovery-preflight.mjs "$(git rev-parse HEAD)"
            echo "retry=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Production identity cannot be verified; refusing to spend build quota on an unknown target."
            exit 1
          fi
      - name: Trigger Vercel through existing Git integration
        id: trigger
        if: steps.inspect.outputs.retry == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(git branch --show-current)" != "main" ]; then
            echo "::error::Recovery is not on main"; exit 1
          fi
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Working tree is not clean"; exit 1
          fi
          git fetch origin main --depth=1
          if [ "$(git rev-parse origin/main)" != "$(git rev-parse HEAD)" ]; then
            echo "::warning::main changed; skipping rather than overriding anyone's changes."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # A verified, empty main commit triggers Vercel's existing GitHub push integration.
          # No paid plan, Vercel API token, new deployment hooks or branch force-push.
          git commit --allow-empty -m 'chore(deploy): requeue verified production after quota reset'
          new_sha="$(git rev-parse HEAD)"
          git push origin HEAD:main
          printf 'new_sha=%s\n' "$new_sha" >> "$GITHUB_OUTPUT"
          echo "Requeued Vercel build for main $new_sha"
      - name: Verify new production commit
        id: verify
        if: steps.trigger.outputs.new_sha != ''
        env:
          PUBLISHED_SHA: ${{ steps.trigger.outputs.new_sha }}
        run: node scripts/release-recovery.mjs wait "$PUBLISHED_SHA"
      - name: Install pinned browser tooling for live screenshots
        if: steps.verify.outcome == 'success'
        shell: bash
        run: |
          npm install --no-save --no-package-lock playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Capture 4 live pages at desktop and mobile sizes
        id: capture
        if: steps.verify.outcome == 'success'
        env:
          PUBLISHED_SHA: ${{ steps.trigger.outputs.new_sha }}
        run: node scripts/capture-live-preview.mjs "$PUBLISHED_SHA"
      - name: Upload verified live-page screenshots
        if: steps.capture.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: vivlica-verified-live-pages
          path: artifacts/live-release/
          if-no-files-found: error
          retention-days: 30
      - name: Summarize outcome
        if: always()
        env:
          NEW_SHA: ${{ steps.trigger.outputs.new_sha }}
        shell: bash
        run: |
          {
            echo '## Vivlica production recovery'
            echo
            echo '- Target: https://vivlica.com'
            echo "- Retry commit: ${NEW_SHA:-not created}"
            echo '- Deploy is **verified only** when /release.json matches the new full main SHA.'
            echo '- GitHub Actions restored + Vercel quota restored + working Git integration are required.'
            echo '- Never interpret a queued build as a confirmed publication.'
            echo '- The release is pictured only after SHA match, successful CI preflight, and a second production SHA match after capture.'
            echo "- Screenshots (if successful): https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} (artifact: vivlica-verified-live-pages)"
          } >> "$GITHUB_STEP_SUMMARY"
