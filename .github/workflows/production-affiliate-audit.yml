name: Production and affiliate readiness audit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'  # weekly, Monday 12:00 JST

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install, unit-test, lint and build
        run: |
          npm ci
          npm run test:all
          npm run lint
          npm run build
      - name: Check production site via real HTTP
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule'
        shell: bash
        env:
          PUBLIC_SITE_URL: https://hikaku-labo.vercel.app
        run: |
          set -euo pipefail
          for path in "/" "/tools/" "/travel/" "/guides/travel-budget/" "/guides/website-tools/" "/robots.txt" "/sitemap.xml"; do
            printf '\n=== Checking %s%s ===\n' "$PUBLIC_SITE_URL" "$path"
            status=$(curl -L -sS --max-time 30 --retry 2 -o /tmp/hikaku-check.html -w '%{http_code}' "$PUBLIC_SITE_URL$path")
            echo "HTTP status: $status"
            echo "Downloaded bytes: $(wc -c < /tmp/hikaku-check.html)"
            if [ "$status" != "200" ]; then
              head -c 450 /tmp/hikaku-check.html || true
              echo
              echo "::error::Production endpoint $path returned HTTP $status. Check Vercel domains, deployed output, and deployment protection."
              exit 1
            fi
            if [ "$path" = "/travel/" ]; then
              grep -q '旅行予算シミュレーター' /tmp/hikaku-check.html || {
                echo "::error::Travel page not served at /travel/."
                exit 1
              }
            fi
            if [ "$path" = "/sitemap.xml" ]; then
              grep -q 'https://hikaku-labo.vercel.app/guides/travel-budget/' /tmp/hikaku-check.html || {
                echo "::error::Sitemap missing travel guide."
                exit 1
              }
            fi
            if [ "$path" = "/tools/" ]; then
              grep -q '無料ITツール診断' /tmp/hikaku-check.html || {
                echo "::error::The /tools/ URL does not serve the expected tools page."
                exit 1
              }
            fi
          done
      - name: Audit production npm dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Check advertising setup (not actual revenue)
        if: always()
        run: node scripts/audit-affiliate.mjs
      - name: Require approved ads before claiming monetization
        if: always() && github.event_name == 'workflow_dispatch'
        run: node scripts/audit-affiliate.mjs --require-placements
