name: Tools selector CI

on:
  push:
    branches: [main, feat/saas-affiliate-selector]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:all
      - run: npm run sync:database-routes -- --check
      - run: npm run lint
      - run: npm run build
      - run: npm run verify:build
      - run: npm run audit:affiliate
      - name: Check Cloudflare app and redirect deployments without publishing
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: npm run check:cloudflare
